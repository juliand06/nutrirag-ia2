name: NutriStudio AI — CI Build, Security & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret & PII Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no API keys in frontend source
        run: |
          if grep -rnE "VITE_(OPENAI|GEMINI|STRIPE_SECRET)_API_KEY|AIza[0-9A-Za-z_-]{35}|sk_live_" frontend/src; then
            echo "ERROR: Secret key found in frontend source!"
            exit 1
          fi

  frontend:
    name: Frontend (Vite Build + Vitest)
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  backend:
    name: Backend (Spring Boot + JUnit + Flyway Validate)
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test
      - run: ls -la src/main/resources/db/migration/V1__init_schema.sql src/main/resources/db/migration/V2__phase5_enterprise_schema.sql

server:
  port: ${PORT:8080}

spring:
  application:
    name: nutrirag-ia2-backend
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled-in-local}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled-in-local}
            scope: openid,profile,email

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:nutrirag_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: pgvector
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/nutrirag_db}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:nutrirag_user}
    password: ${POSTGRES_PASSWORD:nutrirag_password}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

nutrirag:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:NutriStudioSuperSecretKeyForJwtSigningAtLeast256BitsLong2026!}
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:60}
  storage:
    temp-dir: ${java.io.tmpdir}/nutrirag-temp-uploads
    delete-after-indexing: true
  chunking:
    target-tokens: 650
    overlap-tokens: 100
  ai:
    provider: ${AI_PROVIDER:DEMO}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-embedding-model: text-embedding-3-small
    openai-chat-model: gpt-4o-mini
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-embedding-model: text-embedding-004
    gemini-chat-model: gemini-2.5-flash

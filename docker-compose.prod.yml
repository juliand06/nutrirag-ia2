services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nutrirag-pgvector-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    volumes:
      - pgvector_prod_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - ./docker/backup-postgres.sh:/scripts/backup-postgres.sh:ro
      - ./docker/restore-postgres.sh:/scripts/restore-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutrirag-api-prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS required}
      FHIR_BASE_URL: ${FHIR_BASE_URL:-https://hapi.fhir.org/baseR4}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      AI_PROVIDER: ${AI_PROVIDER:-GEMINI}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL required}
        VITE_FHIR_SANDBOX_URL: ${VITE_FHIR_SANDBOX_URL:-https://hapi.fhir.org/baseR4}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: nutrirag-web-prod
    depends_on:
      - api
    ports:
      - "80:80"
    restart: always

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: nutrirag-prometheus-prod
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: always

  grafana:
    image: grafana/grafana:11.3.0
    container_name: nutrirag-grafana-prod
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
    ports:
      - "3001:3000"
    volumes:
      - grafana_prod_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

  db-backup:
    image: pgvector/pgvector:pg16
    container_name: nutrirag-backup-prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: "30"
    volumes:
      - ./docker/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - pg_prod_backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do /usr/local/bin/backup-postgres.sh; sleep 86400; done"]
    restart: always

volumes:
  pgvector_prod_data:
  prometheus_prod_data:
  grafana_prod_data:
  pg_prod_backups:

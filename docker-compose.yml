version: '3.8'

services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: nutrirag-pgvector
    environment:
      POSTGRES_USER: nutrirag_user
      POSTGRES_PASSWORD: nutrirag_password
      POSTGRES_DB: nutrirag_db
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

volumes:
  pgvector_data:

